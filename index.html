<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrast Shower Timer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
        }
        #display {
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        #status {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #aaaaaa;
            text-align: center;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 80%;
            max-width: 300px;
        }
        button {
            width: 100%;
            padding: 1.5rem;
            font-size: 1.5rem;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        #startBtn {
            background-color: #28a745;
        }
        #startBtn:active:not(:disabled) {
            background-color: #218838;
        }
        #nextBtn {
            background-color: #343a40;
            color: #ffffff;
        }
        #nextBtn:active:not(:disabled) {
            background-color: #23272b;
        }
        #stopBtn {
            background-color: #ffffff;
            color: #000000;
        }
        #stopBtn:active:not(:disabled) {
            background-color: #e2e2e2;
        }
        button:disabled {
            background-color: #2a2a2a;
            color: #555555;
            cursor: not-allowed;
        }
        #stopBtn:disabled {
            background-color: rgba(255, 255, 255, 0.3);
            color: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="status">Ready (3 Cycles)</div>
    <div id="display">00:00</div>
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="nextBtn" disabled>Next Stage</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>

    <script>
        let timerInterval;
        let currentPhase = 'idle';
        let timeLeft = 0;
        let cyclesLeft = 3;
        let audioCtx;
        let wakeLock = null;

        const displayEl = document.getElementById('display');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const nextBtn = document.getElementById('nextBtn');
        const stopBtn = document.getElementById('stopBtn');

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock permission denied.');
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
        }

        function playAlert(frequency) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frequency;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.stop(audioCtx.currentTime + 1.5);
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            displayEl.textContent = `${m}:${s}`;
        }

        function tick(silent = false) {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
                return;
            }

            if (currentPhase === 'hot') {
                if (!silent) playAlert(400);
                currentPhase = 'cold';
                timeLeft = 60;
                statusEl.textContent = `Cold Phase - Cycle ${4 - cyclesLeft}/3`;
                statusEl.style.color = '#00d2ff';
            } else if (currentPhase === 'cold') {
                if (!silent) playAlert(800);
                cyclesLeft--;
                
                if (cyclesLeft > 0) {
                    currentPhase = 'hot';
                    timeLeft = 180;
                    statusEl.textContent = `Hot Phase - Cycle ${4 - cyclesLeft}/3`;
                    statusEl.style.color = '#ff4b4b';
                } else {
                    stopTimer();
                    statusEl.textContent = 'Finished';
                    statusEl.style.color = '#4bff4b';
                }
            }
            updateDisplay();
        }

        function nextStage() {
            if (currentPhase === 'idle') return;
            timeLeft = 0;
            tick(true);
        }

        function startTimer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            requestWakeLock();

            clearInterval(timerInterval);
            cyclesLeft = 3;
            currentPhase = 'hot';
            timeLeft = 180;
            
            statusEl.textContent = 'Hot Phase - Cycle 1/3';
            statusEl.style.color = '#ff4b4b';
            
            startBtn.disabled = true;
            nextBtn.disabled = false;
            stopBtn.disabled = false;
            
            updateDisplay();
            
            // Wrap in an arrow function to guarantee no browser-specific arguments are passed
            timerInterval = setInterval(() => tick(false), 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            releaseWakeLock();
            
            currentPhase = 'idle';
            timeLeft = 0;
            cyclesLeft = 3;
            
            statusEl.textContent = 'Ready (3 Cycles)';
            statusEl.style.color = '#aaaaaa';
            displayEl.textContent = '00:00';
            
            startBtn.disabled = false;
            nextBtn.disabled = true;
            stopBtn.disabled = true;
        }

        startBtn.addEventListener('click', startTimer);
        nextBtn.addEventListener('click', nextStage);
        stopBtn.addEventListener('click', stopTimer);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrast Shower Timer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
        }
        #display {
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        #status {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #aaaaaa;
            text-align: center;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 80%;
            max-width: 300px;
        }
        button, #stageLabel {
            -webkit-user-select: none;
            user-select: none;
        }
        button {
            width: 100%;
            padding: 1.5rem;
            font-size: 1.5rem;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        #startBtn {
            background-color: #28a745;
        }
        #startBtn:active:not(:disabled), #startBtn.touching:not(:disabled) {
            background-color: #218838;
        }
        .stage-control {
            position: relative;
            height: 76px;
            background-color: #1c1f20;
            border-radius: 8px;
            overflow: hidden;
        }
        #stageLabel {
            position: absolute;
            z-index: 1;
            top: calc(50% - 3px);
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 0 0.625rem;
            font-size: 1.375rem;
            line-height: 24px;
            font-weight: 500;
            color: #f0f2f3;
            pointer-events: none;
        }
        .stage-buttons {
            display: flex;
            height: 100%;
        }
        .stage-buttons button {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 0;
            background-color: transparent;
            color: #d6dce0;
            touch-action: manipulation;
        }
        .stage-buttons button:active:not(:disabled) {
            background-color: #2a2f32;
        }
        .stage-buttons button:focus-visible {
            outline: 2px solid #a6b5be;
            outline-offset: -4px;
        }
        .stage-buttons button:disabled {
            background-color: transparent;
            color: #747b7f;
        }
        @media (hover: hover) {
            .stage-buttons button:hover {
                background-color: #24282a;
            }
        }
        .stage-buttons button.touching {
            background-color: #24282a;
        }
        button.touching {
            transition: none;
        }
        .stage-buttons svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #stopBtn {
            background-color: #ffffff;
            color: #000000;
        }
        #stopBtn:active:not(:disabled), #stopBtn.touching:not(:disabled) {
            background-color: #e2e2e2;
        }
        button:disabled {
            background-color: #2a2a2a;
            color: #555555;
            cursor: not-allowed;
        }
        #stopBtn:disabled {
            background-color: rgba(255, 255, 255, 0.3);
            color: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="status">Ready (3 Cycles)</div>
    <div id="display">00:00</div>
    <div class="controls">
        <button id="startBtn">Start</button>
        <div class="stage-control" role="group" aria-labelledby="stageLabel">
            <div id="stageLabel">Stage</div>
            <div class="stage-buttons">
                <button id="prevBtn" aria-label="Previous stage" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="m10 5-7 7 7 7m11-14-7 7 7 7" />
                    </svg>
                </button>
                <button id="nextBtn" aria-label="Next stage" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="m3 5 7 7-7 7m11-14 7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
        <button id="stopBtn" disabled>Stop</button>
    </div>

    <script>
        let timerInterval;
        let currentPhase = 'idle';
        let timeLeft = 0;
        let cyclesLeft = 3;
        let audioCtx;
        let wakeLock = null;

        const displayEl = document.getElementById('display');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const stopBtn = document.getElementById('stopBtn');

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock permission denied.');
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
        }

        async function resumeAudio() {
            if (!audioCtx || audioCtx.state === 'running') return;

            try {
                await audioCtx.resume();
            } catch (err) {
                console.warn('Audio could not resume.', err);
            }
        }

        async function playAlert(frequency) {
            if (!audioCtx) return;
            if (audioCtx.state !== 'running') await resumeAudio();
            if (audioCtx.state !== 'running') return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frequency;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.stop(audioCtx.currentTime + 1.5);
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            displayEl.textContent = `${m}:${s}`;
            prevBtn.disabled = currentPhase === 'idle' || (currentPhase === 'hot' && cyclesLeft === 3);
        }

        function tick(silent = false) {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
                return;
            }

            if (currentPhase === 'hot') {
                if (!silent) playAlert(400);
                currentPhase = 'cold';
                timeLeft = 60;
                statusEl.textContent = `Cold Phase - Cycle ${4 - cyclesLeft}/3`;
                statusEl.style.color = '#00d2ff';
            } else if (currentPhase === 'cold') {
                if (!silent) playAlert(800);
                cyclesLeft--;
                
                if (cyclesLeft > 0) {
                    currentPhase = 'hot';
                    timeLeft = 180;
                    statusEl.textContent = `Hot Phase - Cycle ${4 - cyclesLeft}/3`;
                    statusEl.style.color = '#ff4b4b';
                } else {
                    stopTimer();
                    statusEl.textContent = 'Finished';
                    statusEl.style.color = '#4bff4b';
                }
            }
            updateDisplay();
        }

        function previousStage() {
            if (currentPhase === 'idle' || (currentPhase === 'hot' && cyclesLeft === 3)) return;

            if (currentPhase === 'hot') cyclesLeft++;
            currentPhase = currentPhase === 'hot' ? 'cold' : 'hot';
            timeLeft = currentPhase === 'hot' ? 180 : 60;

            statusEl.textContent = `${currentPhase === 'hot' ? 'Hot' : 'Cold'} Phase - Cycle ${4 - cyclesLeft}/3`;
            statusEl.style.color = currentPhase === 'hot' ? '#ff4b4b' : '#00d2ff';
            updateDisplay();
        }

        function nextStage() {
            if (currentPhase === 'idle') return;
            timeLeft = 0;
            tick(true);
        }

        function startTimer() {
            // Use media volume on iOS, including in silent mode.
            if (navigator.audioSession) navigator.audioSession.type = 'playback';

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            resumeAudio();

            // Unlock output during the tap, before the first timed alert.
            const source = audioCtx.createBufferSource();
            source.buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
            source.connect(audioCtx.destination);
            source.onended = () => source.disconnect();
            source.start();

            requestWakeLock();

            clearInterval(timerInterval);
            cyclesLeft = 3;
            currentPhase = 'hot';
            timeLeft = 180;
            
            statusEl.textContent = 'Hot Phase - Cycle 1/3';
            statusEl.style.color = '#ff4b4b';
            
            startBtn.disabled = true;
            nextBtn.disabled = false;
            stopBtn.disabled = false;
            
            updateDisplay();
            
            // Wrap in an arrow function to guarantee no browser-specific arguments are passed
            timerInterval = setInterval(() => tick(false), 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            releaseWakeLock();
            
            currentPhase = 'idle';
            timeLeft = 0;
            cyclesLeft = 3;
            
            statusEl.textContent = 'Ready (3 Cycles)';
            statusEl.style.color = '#aaaaaa';
            displayEl.textContent = '00:00';
            
            startBtn.disabled = false;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            stopBtn.disabled = true;
        }

        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => button.classList.add('touching'), { passive: true });

            for (const event of ['touchend', 'touchcancel', 'touchmove']) {
                button.addEventListener(event, () => button.classList.remove('touching'), { passive: true });
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && currentPhase !== 'idle') resumeAudio();
        });
        document.addEventListener('click', () => {
            if (currentPhase !== 'idle') resumeAudio();
        });

        startBtn.addEventListener('click', startTimer);
        prevBtn.addEventListener('click', previousStage);
        nextBtn.addEventListener('click', nextStage);
        stopBtn.addEventListener('click', stopTimer);
    </script>
</body>
</html>
